# Netlify configuration — Auroraflow website
# The site is plain static HTML/CSS/JS (no build step); just publish the
# site folder so www.auroraflow.com/ serves auroraflow-website/index.html.
[build]
  publish = "auroraflow-website"

# Long-cache the fingerprinted assets (images/fonts/media) for speed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirects from the old site's URL structure, so links and search results
# indexed against the previous site land on the current pages instead of 404.
[[redirects]]
  from = "/services-and-treatments/*"
  to = "/services/:splat"
  status = 301

[[redirects]]
  from = "/post/services-preview"
  to = "/services"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301

# Energy Healing was renamed to Guided Energy Work; keep the old URL working.
[[redirects]]
  from = "/services/energy-healing.html"
  to = "/services/guided-energy-work"
  status = 301

[[redirects]]
  from = "/services-and-treatments/energy-healing"
  to = "/services/guided-energy-work"
  status = 301

# Pages are still served from their .html files on disk (Netlify resolves
# /page to page.html automatically), but every internal link now points at
# the extensionless URL. This sends anyone hitting an old bookmarked or
# indexed *.html URL on to the clean one instead of serving duplicate
# content at two addresses. force = true is required since the .html files
# actually exist on disk — without it, Netlify serves the file instead of
# applying the redirect. Placed last so the more specific rules above still
# win for their exact legacy paths.
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true
